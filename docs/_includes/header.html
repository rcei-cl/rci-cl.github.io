<header class="site-header">
  <div class="wrap">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <span class="site-brand__title">{{ site.short_title }}</span>
      <span class="site-brand__subtitle">{{ site.title }}</span>
    </a>
    <nav class="site-nav">
      <button class="site-nav__toggle" aria-expanded="false" aria-controls="site-nav-menu">
        <span>Menú</span>
      </button>
      <ul class="site-nav__menu" id="site-nav-menu">
        {% for item in site.nav %}
        <li>
          <a href="{{ item.url | relative_url }}"
             {% if page.url == item.url %}aria-current="page"{% endif %}>
            {{ item.title }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var toggle = document.querySelector(".site-nav__toggle");
    var menu = document.querySelector(".site-nav__menu");
    if (!toggle || !menu) return;
    toggle.addEventListener("click", function () {
      var expanded = toggle.getAttribute("aria-expanded") === "true";
      toggle.setAttribute("aria-expanded", String(!expanded));
      menu.classList.toggle("is-open");
    });
  });
</script>
